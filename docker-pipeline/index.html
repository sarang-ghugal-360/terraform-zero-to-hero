<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevOps Engineer</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      background: #0f172a;
      color: #e2e8f0;
    }

    nav {
      display: flex;
      justify-content: space-between;
      padding: 20px 50px;
      background: #020617;
      position: sticky;
      top: 0;
    }

    nav h2 {
      color: #38bdf8;
    }

    nav a {
      color: #cbd5f5;
      margin-left: 20px;
      text-decoration: none;
    }

    header {
      text-align: center;
      padding: 80px 20px;
    }

    header h1 {
      font-size: 3rem;
      color: #38bdf8;
    }

    header p {
      margin-top: 10px;
      color: #94a3b8;
    }

    .btn {
      margin-top: 20px;
      padding: 10px 20px;
      background: #38bdf8;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    section {
      padding: 60px 40px;
      max-width: 1100px;
      margin: auto;
    }

    h2 {
      margin-bottom: 20px;
      color: #38bdf8;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 10px;
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
      background: #334155;
    }

    .pipeline {
      text-align: center;
      font-size: 1.3rem;
      background: #020617;
      padding: 30px;
      border-radius: 10px;
      color: #22c55e;
    }

    footer {
      text-align: center;
      padding: 20px;
      border-top: 1px solid #1e293b;
      color: #64748b;
    }
  </style>

</head>

<body>

<nav>
  <h2>DevOps</h2>
  <div>
    <a href="#skills">Skills</a>
    <a href="#tools">Tools</a>
    <a href="#pipeline">Pipeline</a>
  </div>
</nav>

<header>
  <h1>🚀 DevOps & Cloud Engineer</h1>
  <p id="typing"></p>
  <button class="btn" onclick="showAlert()">View Project</button>
</header>

<section id="skills">
  <h2>🧰 Skills</h2>
  <div class="grid">
    <div class="card">Docker</div>
    <div class="card">Terraform</div>
    <div class="card">AWS</div>
    <div class="card">CI/CD</div>
  </div>
</section>

<section id="tools">
  <h2>☁️ Tools</h2>
  <div class="grid">
    <div class="card">GitHub Actions</div>
    <div class="card">Linux</div>
    <div class="card">Nginx</div>
    <div class="card">Shell</div>
  </div>
</section>

<section id="pipeline">
  <h2>⚙️ Deployment Pipeline</h2>
  <div class="pipeline">
    GitHub → Docker → Terraform → AWS EC2 🚀
  </div>
</section>

<footer>
  © 2026 DevOps Engineer | Built for Practice
</footer>

<script>
  // typing effect
  const text = "Building scalable systems with automation & cloud 🚀";
  let i = 0;

  function type() {
    if (i < text.length) {
      document.getElementById("typing").innerHTML += text.charAt(i);
      i++;
      setTimeout(type, 50);
    }
  }

  type();

  function showAlert() {
    alert("CI/CD Pipeline Successfully Triggered 🚀");
  }
</script>

</body>
</html>
